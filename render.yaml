services:
  - type: web
    name: breathe-esg-prototype
    runtime: python
    plan: free
    buildCommand: npm ci && npm run build && pip install -r requirements.txt && cd backend && python manage.py collectstatic --noinput
    startCommand: cd backend && python manage.py migrate && gunicorn config.wsgi
    envVars:
      - key: DEBUG
        value: "0"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: SECRET_KEY
        generateValue: true
